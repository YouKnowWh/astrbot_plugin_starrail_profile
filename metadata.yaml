name: astrbot_plugin_starrail_profile
display_name: 星铁展示柜与配队顾问
desc: 常规配队与货币战争顾问，可在配置中启用 UID 绑定、展示柜图片与个人配队。
help: |
  默认提供常规资料、货币战争建议和 /星铁数据。开启内置练度查询后可用：
  /绑定星铁 <UID>、/我的星铁UID、/星铁面板 [UID]、/解绑星铁
  /星铁配队 [作战目标]
  /srprofile 100534214
  /sr 100534214
  也可以直接说：帮我查一下星铁 UID 100534214
version: v1.2.1
author: YueHua46
repo: https://github.com/YouKnowWh/astrbot_plugin_starrail_profile
astrbot_version: ">=4.29.4,<5"
